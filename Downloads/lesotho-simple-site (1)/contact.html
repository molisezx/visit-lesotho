<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Visit Lesotho</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Visit Lesotho</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
        <li class="nav-item"><a class="nav-link" href="accommodation.html">Accommodation</a></li>
        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul></div>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-title"><div class="container"><h1>Contact & Booking</h1><p class="mb-0">Register your trip request.</p></div></section>
    <section class="bg-light-sand"><div class="container"><div class="row justify-content-center"><div class="col-12 col-lg-8">
      <div class="form-box">
        <div id="formMessage"></div>
        <form id="bookingForm" novalidate><div class="row g-3">
          <div class="col-12 col-md-6"><label class="form-label" for="name">Full name</label><input class="form-control" type="text" id="name" placeholder="Thabo Mokoena" required><div class="error text-danger small"></div></div>
          <div class="col-12 col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" placeholder="name@example.com" required><div class="error text-danger small"></div></div>
          <div class="col-12 col-md-6"><label class="form-label" for="phone">Phone</label><input class="form-control" type="tel" id="phone" placeholder="+266 58881234" required><div class="error text-danger small"></div></div>
          <div class="col-12 col-md-6"><label class="form-label" for="lodge">Accommodation</label>
            <select class="form-select" id="lodge"><option value="0">Choose a lodge</option>
              <option value="1200">Semonkong Lodge - M1,200</option><option value="3500">Maliba Lodge - M3,500</option>
              <option value="600">Sani Mountain Lodge - M600</option><option value="1000">Katse Lodge - M1,000</option></select>
            <div class="error text-danger small"></div></div>
          <div class="col-12 col-md-6"><label class="form-label" for="nights">Number of nights</label><input class="form-control" type="number" id="nights" min="1" max="30" value="1"><div class="error text-danger small"></div></div>
          <div class="col-12"><div class="alert alert-info mb-0">Estimated total: <strong id="total">M0</strong></div></div>
          <div class="col-12 col-md-6"><label class="form-label" for="gender">Gender</label><select class="form-select" id="gender"><option>Female</option><option>Male</option><option>Prefer not to say</option></select><div class="error"></div></div>
          <div class="col-12 col-md-6"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" placeholder="8+ characters and a number" required><div class="error text-danger small"></div></div>
          <div class="col-12 col-md-6"><label class="form-label" for="confirm">Confirm password</label><input class="form-control" type="password" id="confirm" placeholder="Repeat password" required><div class="error text-danger small"></div></div>
          <div class="col-12"><button class="btn btn-gold" type="submit">Submit</button></div>
        </div></form>
      </div>
    </div></div></div></section>

  </main>

  <footer>
    <p class="mb-0">&copy; 2026 Visit Lesotho | Limkokwing University of Creative Technology</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
