<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Visit Lesotho</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul></div>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-title"><div class="container"><h1>Photo Gallery</h1><p class="mb-0">Click any photo to open it.</p></div></section>
    <section><div class="container"><div class="row g-3">
      <div class="col-6 col-md-4 col-lg-3"><img class="gallery-img" src="images/katse-dam.jpg" alt="Katse Dam from above"></div>
      <div class="col-6 col-md-4 col-lg-3"><img class="gallery-img" src="images/maletsunyane-falls.jpg" alt="Maletsunyane Falls"></div>
      <div class="col-6 col-md-4 col-lg-3"><img class="gallery-img" src="images/sani-pass.jpg" alt="Sani Pass road"></div>
      <div class="col-6 col-md-4 col-lg-3"><img class="gallery-img" src="images/cultural-amphitheatre.jpg" alt="Cultural centre"></div>
    </div></div></section>

    <div class="modal fade" id="lightbox" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="bigCaption"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body text-center"><img id="bigImage" src="" alt="" class="img-fluid"></div>
      <div class="modal-footer justify-content-between"><button id="prevBtn" class="btn btn-dark">Previous</button><button id="nextBtn" class="btn btn-gold">Next</button></div>
    </div></div></div>

  </main>

  <footer>
